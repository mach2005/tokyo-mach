name: Daily 0AM Auto-Update and Deploy Website

on:
  schedule:
    # 毎日 日本時間 0:15 (UTC 15:15) に自動起動
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Latest X (Twitter) Feed
        run: |
          python develop/update_x_feed.py || echo "X feed update warning"

      - name: Fetch Latest Instagram Feed
        run: |
          python develop/update_ig_feed.py || echo "Instagram feed update warning"

      - name: Fetch Latest Game Results & Next Visitor
        run: |
          python develop/update_game_result.py || echo "Result fetch completed with minor warning"

      - name: Run Build Scripts
        run: |
          python develop/build_pages.py
          python develop/gen_songs.py

      - name: Internal Link Verification
        run: |
          python -c "
          import os, re
          from pathlib import Path
          base = Path('.')
          html_files = [f for f in base.glob('**/*.html') if not any(x in str(f) for x in ['history', '.git', 'archive', 'develop', 'tmp'])]
          broken = []
          for h in html_files:
              content = open(h, 'r', encoding='utf-8', errors='ignore').read()
              links = re.findall(r'(?:href|src)=[\"\\\']([^\"\\\'#?]+)[\"\\\']', content)
              for l in links:
                  if not l.startswith(('http', '//', 'data:', 'mailto:', '#')):
                      target = (h.parent / l).resolve()
                      if not target.exists():
                          broken.append((str(h.relative_to(base)), l))
          if broken:
              print('WARNING: Broken links detected (non-blocking):')
              for src, link in broken:
                  print(f'  {src} -> {link}')
          else:
              print('All internal links verified successfully!')
          "

      - name: Commit and Push if changes exist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-Update (0 AM Daily Cron): X feed, Game results, Next Visitor & schedule rebuild [skip ci]"
            git push origin main
          fi
